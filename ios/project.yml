# Проект Xcode генерируется из этого файла: xcodegen generate
name: VPNTLS
options:
  bundleIdPrefix: tech.extree
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # Team ID из Apple Developer — понадобится для установки
targets:
  VPNTLS:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - target: PacketTunnel
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: VPN-TLS
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.extree.vpntls
        TARGETED_DEVICE_FAMILY: "1"

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources: [PacketTunnel]
    dependencies:
      - framework: Mobile.xcframework
        embed: false   # gomobile собирает статическую библиотеку
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: VPN-TLS Tunnel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.extree.vpntls.tunnel
        OTHER_LDFLAGS: ["-lresolv"]   # нужен Go-рантайму для DNS
