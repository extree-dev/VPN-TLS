# VPN-TLS: свой Caddy (TLS, сайт-заглушка) + VPN-сервер за ним.
# Настройки — в файле .env (пример: .env.example).
services:
  vpn:
    build: .
    image: vpn-tls-server
    container_name: vpn-tls
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - ./data:/data
    environment:
      VPN_PLAIN: ":8080"
      VPN_PATH: ${VPN_PATH:-/api/stream}
      VPN_DOMAIN: ${DOMAIN:-localhost}
      VPN_PUBLIC: ${PUBLIC_ADDR:-}
      VPN_PUBLIC_PORT: ${PORT:-443}
      VPN_CLIENTS: /data/clients.txt
      VPN_DNS: ${DNS:-1.1.1.1,1.0.0.1}
      VPN_NAT: "1"
      # С настоящим сертификатом (CADDYFILE=Caddyfile.acme) pin в строках не нужен.
      VPN_PIN: ${PIN:-auto}
    healthcheck:
      test: ["CMD", "test", "-f", "/data/tls.crt"]
      interval: 2s
      retries: 15

  caddy:
    build:
      context: ./deploy
      dockerfile: caddy.Dockerfile
    image: vpn-tls-caddy
    container_name: vpn-tls-caddy
    restart: unless-stopped
    depends_on:
      vpn:
        condition: service_healthy
    ports:
      - "${PORT:-443}:443/tcp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      VPN_PATH: ${VPN_PATH:-/api/stream}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
    volumes:
      - ./deploy/${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - ./deploy/site:/srv:ro
      - ./data:/vpn-data:ro
      - caddy_data:/data

volumes:
  caddy_data:
