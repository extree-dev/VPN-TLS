name: iOS

on:
  push:
    paths: ['ios/**', 'mobile/**', 'internal/**', 'go.mod', 'go.sum', '.github/workflows/ios.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Go-ядро → Mobile.xcframework
        run: |
          go get golang.org/x/mobile/bind
          gomobile bind -target ios,iossimulator -iosversion 15.0 -o ios/Mobile.xcframework ./mobile

      - name: Проект Xcode
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Сборка (без подписи — проверка, что всё компилируется)
        shell: bash
        run: |
          set -o pipefail
          cd ios
          xcodebuild -project VPNTLS.xcodeproj -target VPNTLS -configuration Release \
            -sdk iphoneos CODE_SIGNING_ALLOWED=NO build | tail -n 80
